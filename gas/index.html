<style>
/* Layout: 좌측 고정 메뉴 + 작업 영역. 좁은 화면에서는 메뉴가 상단 가로 스크롤로 바뀜. 출석체크는 큰 탭 카드 격자. */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --sunk:#e8ece7; --fg:#17201c; --muted:#3b4842; --line:#d3dbd5;

  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#5dbd99; --accent-ink:#08170f; --accent-soft:#1c392e;
  --warn:#e5a54c; --warn-soft:#3a2a12; --danger:#f17d70; --danger-soft:#3e1c18; --info:#86aee8; --info-soft:#1c2a40; color-scheme:dark}}
:root[data-theme="dark"]{

  --accent:#5dbd99; --accent-ink:#08170f; --accent-soft:#1c392e;
  --warn:#e5a54c; --warn-soft:#3a2a12; --danger:#f17d70; --danger-soft:#3e1c18; --info:#86aee8; --info-soft:#1c2a40; color-scheme:dark}

/* 출석 카드 */
.att-top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px 10px;margin-top:-8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:14px 12px 12px;min-height:84px;display:flex;flex-direction:column;gap:2px;position:relative;user-select:none;-webkit-tap-highlight-color:transparent;transition:background .12s,border-color .12s,transform .08s}

.card.on .sub{color:var(--accent-ink);opacity:.92}
.card.on .ck{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--accent)}
.card .flag{font-size:12.5px;color:var(--warn)}

body.tablet nav.side{display:none}
body.tablet .app{grid-template-columns:1fr}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(10,16,13,.45);display:grid;place-items:center;z-index:50;padding:16px}

<script>
/* ============ 공용 유틸 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const lastDow=(dow,from)=>{const d=parseD(from||today());d.setDate(d.getDate()-((d.getDay()-dow+7)%7));return iso(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const monthsBetween=(a,b)=>{const A=parseD(a),B=parseD(b);let m=(B.getFullYear()-A.getFullYear())*12+B.getMonth()-A.getMonth();if(B.getDate()<A.getDate())m--;return m};
const ageOf=(birth,at)=>/^\d{4}-\d{2}-\d{2}$/.test(birth||'')?Math.floor(monthsBetween(birth,at||today())/12):null;
/* 생일: 'YYYY-MM-DD'(전체) · 'MM-DD'(월일) · 'MM'(월만) 세 가지 형태를 허용 */
function normBirth(v){
  v=String(v==null?'':v).trim();if(!v)return '';let m;const p2=x=>String(x).padStart(2,'0');
  if((m=v.match(/^(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/)))return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if((m=v.match(/^(\d{4})(\d{2})(\d{2})$/)))return `${m[1]}-${m[2]}-${m[3]}`;
  if((m=v.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?$/))&&+m[1]>=1&&+m[1]<=12)return `${p2(m[1])}-${p2(m[2])}`;
  if((m=v.match(/^(\d{1,2})\s*월?$/))&&+m[1]>=1&&+m[1]<=12)return p2(m[1]);
  return v;
}
function birthParts(b){b=String(b||'');let m;
  if((m=b.match(/^(\d{4})-(\d{2})-(\d{2})$/)))return {y:+m[1],m:+m[2],d:+m[3]};
  if((m=b.match(/^(\d{2})-(\d{2})$/)))return {m:+m[1],d:+m[2]};
  if((m=b.match(/^(\d{1,2})$/))&&+m[1]>=1&&+m[1]<=12)return {m:+m[1]};
  return {};}
const bMonth=b=>birthParts(b).m||0, bDay=b=>birthParts(b).d||0;
function fmtBirth(b){const p=birthParts(b);if(p.y)return `${p.y}.${pad(p.m)}.${pad(p.d)}`;if(p.d)return `${p.m}월 ${p.d}일`;if(p.m)return `${p.m}월`;return b||'';}
const DOWK='일월화수목금토';
const fmtK=s=>{if(!s)return'';const d=parseD(s);return `${d.getMonth()+1}.${d.getDate()}(${DOWK[d.getDay()]})`};
const fmtY=s=>s?s.replace(/-/g,'.'):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=s=>[...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c}).join('');
const nameMatch=(name,q)=>{q=(q||'').replace(/\s/g,'');if(!q)return true;return name.includes(q)||cho(name).includes(q)};
const ko=(a,b)=>a.localeCompare(b,'ko');
const shortCat=c=>String(c).replace(/헌금$/,'').replace('구제/기타','구제·기타');

/* ============ 공유 로직 (Apps Script와 동일 코드) ============ */
function mergeData(a,b){
  a=a||{};b=b||{};const out={version:1};
  const real=x=>x&&x.updatedAt!==1&&x.t!==1; /* 예시 데이터(수정시각 1)는 동기화하지 않음 */
  const sa=a.settings||{},sb=b.settings||{};
  out.settings=Object.assign({},(sb.updatedAt||0)>(sa.updatedAt||0)?sb:sa);
  const mm={};[].concat(a.members||[],b.members||[]).forEach(m=>{if(!real(m)||!m.id)return;const c=mm[m.id];if(!c||(m.updatedAt||0)>(c.updatedAt||0))mm[m.id]=m});
  out.members=Object.keys(mm).map(k=>mm[k]);
  ['attendance','offerings'].forEach(f=>{out[f]={};[a[f]||{},b[f]||{}].forEach(o=>Object.keys(o).forEach(k=>{if(!real(o[k]))return;const c=out[f][k];if(!c||(o[k].t||0)>(c.t||0))out[f][k]=o[k]}))});
  const ll={};[].concat(a.logs||[],b.logs||[]).forEach(l=>{if(!real(l)||!l.id)return;const c=ll[l.id];if(!c||(l.t||0)>(c.t||0))ll[l.id]=l});
  out.logs=Object.keys(ll).map(k=>ll[k]);
  return out;
}
/* 헌금집계표(엑셀/구글시트) → 날짜·이름·참여항목. 금액은 버림 */
function parseOfferingGrid(grid,fallbackDate){
  const out=[];let date=fallbackDate||'';let cols=null;
  const SKIPH=/^(no\.?|번호|이름|성명|합계|계|총계|소계|내용|비고)$/i;
  const SKIPN=/(합계|소계|총계|담당|비고|확인|^계$|^no\.?$)/i;
  const num=v=>{const n=parseFloat(String(v).replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
  for(const row of grid){
    const cells=(row||[]).map(c=>String(c==null?'':c).trim());
    const filled=cells.filter(Boolean);
    if(!filled.length)continue;
    const nameIdx=cells.findIndex(c=>/^(이름|성명)$/.test(c.replace(/\s/g,'')));
    if(nameIdx>=0){cols={name:nameIdx,cats:[]};cells.forEach((c,i)=>{const k=c.replace(/\s/g,'');if(i!==nameIdx&&k&&!SKIPH.test(k))cols.cats.push([i,k])});continue}
    const dm=filled.join(' ').match(/(20\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})/);
    if(dm&&filled.length<=3){date=`${dm[1]}-${String(dm[2]).padStart(2,'0')}-${String(dm[3]).padStart(2,'0')}`;cols=null;continue}
    if(!cols||!date)continue;
    const name=(cells[cols.name]||'').replace(/\s/g,'');
    if(!name||SKIPN.test(name)||/^무명/.test(name)||/^\d+$/.test(name))continue;
    const cats=cols.cats.filter(([i])=>num(cells[i])>0).map(c=>c[1]);
    if(cats.length)out.push({date,name,cats});
  }
  return out;
}

/* ============ 저장소 / 실행 환경 ============ */
const LSKEY='seonghyeon-roll-v1';
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
const Host={
  kind: window.churchAPI?'electron':(window.google&&google.script&&google.script.run)?'gas':(location.protocol==='http:'&&/[?&]t=/.test(location.search))?'lan':'web',
  isArtifact(){return !!(window.claude&&typeof window.claude.use==='function')},
  async load(){
    if(this.kind==='electron')return await churchAPI.loadData();
    if(this.kind==='lan')return await lanLoad();
    const s=ls.get(LSKEY);return s?JSON.parse(s):null;
  },
  async save(db){
    if(this.kind==='electron')return churchAPI.saveData(db);
    if(this.kind==='lan')return lanPushSoon();
    ls.set(LSKEY,JSON.stringify(db));
    if(this.kind==='gas')gasPushSoon();
  },
  async saveFile(name,data){
    if(this.kind==='electron')return churchAPI.saveFile(name,data instanceof Uint8Array?data:new TextEncoder().encode(data));
    if(this.isArtifact()){
      const dl=await window.claude.use('downloads');
      if(!dl){toast('이 화면에서는 파일 저장을 지원하지 않습니다');return false}

function idx(){
  if(IDX)return IDX;
  const by=new Map(),sunRec=new Set(),sk=new Set(sunKeys());
  const get=id=>{let o=by.get(id);if(!o){o={days:new Set(),sun:new Set(),last:'',svc:{}};by.set(id,o)}return o};
  for(const k in DB.attendance){
    const [d,s]=k.split('|');const v=DB.attendance[k];
    if(!v.ids||!v.ids.length)continue;
    if(sk.has(s))sunRec.add(d);
    for(const id of v.ids){const o=get(id);o.days.add(d);if(sk.has(s))o.sun.add(d);if(d>o.last)o.last=d;o.svc[s]=(o.svc[s]||0)+1}
  }
  const off=new Map();
  for(const d in DB.offerings){const r=DB.offerings[d].recs||{};for(const id in r){let o=off.get(id);if(!o){o=new Map();off.set(id,o)}o.set(d,r[id])}}
  IDX={by,sunRec:[...sunRec].sort(),off};
  return IDX;
}

/* 정기출석률: 등록일(또는 최근 12개월) 이후, 출석기록이 있는 주일 중 출석한 주일 비율 */
function sundayRate(m,months){
  const T=today();let from=m.regDate||'1900-01-01';
  const lim=addDays(T,-Math.round((months||12)*30.44));if(from<lim)from=lim;
  const recs=idx().sunRec.filter(d=>d>=from&&d<=T);
  const st=mstat(m.id);const att=recs.filter(d=>st.sun.has(d)).length;
  return {att,total:recs.length,rate:recs.length?att/recs.length:0};
}
function absence(m){
  const st=mstat(m.id);const base=st.last||m.regDate||today();
  return {last:st.last,days:daysBetween(base,today())};
}
function eligibility(m){
  const s=S(),T=today(),why=[];
  const months=m.regDate?monthsBetween(m.regDate,T):0;
  const r=sundayRate(m,12);const rateOk=r.total>0&&r.rate*100>=s.regularRate;
  const bap=['세례','입교'].includes(m.baptism);
  const age=ageOf(m.birth);
  if(!bap)why.push('세례(입교) 필요');
  if(!m.regDate)why.push('등록일 없음');
  const pathA=months>=s.memberMonths, pathB=months>=s.eduMonths&&!!m.eduDate;
  if(!pathA&&!pathB)why.push(m.eduDate?`등록 ${months}개월 (교육이수 시 ${s.eduMonths}개월)`:`등록 ${months}개월 (${s.memberMonths}개월 필요)`);
  if(!rateOk)why.push(`주일출석 ${Math.round(r.rate*100)}% (기준 ${s.regularRate}%)`);
  if(age!=null&&age<s.assemblyAge)why.push(`만 ${age}세`);
  return {ok:!why.length,why,months,rate:r,path:pathB&&!pathA?'교육이수':'6개월출석',age};
}
function voteRight(m){const s=S();const mo=m.regDate?monthsBetween(m.regDate,today()):0;const r=sundayRate(m,12);return mo>=s.voteMonths&&r.rate*100>=s.regularRate}

  const per=k=>{const sv=svcBy(k);const d=lastDow(sv.dow,T);return ((DB.attendance[d+'|'+k]||{}).ids||[]).length};

    <div class="kpi"><span>${sunLbl} 출석 (${fmtK(lastSun)})</span><b>${uniq(lastSun)}</b><small>1·2·3부 중복 제외 · ${sunKeys().map(k=>svcBy(k).name.replace('주일 ','')+' '+per(k)).join(' · ')}</small></div>
    <div class="kpi"><span>수요예배 · 금요기도회</span><b>${per('wed')} · ${per('fri')}</b><small>최근 1회 기준</small></div>
    <div class="kpi"><span>살필 교인</span><b>${warnA.length+longA.length}</b><small>${S().warnWeeks}주 이상 결석 · 6개월 이상 ${longA.length}명</small></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>주일 출석 인원 (최근 12주, 1·2·3부 중복 제외)</h2>
      <div class="bars" role="img" aria-label="최근 12주 주일 출석">${weeks.map((w,i)=>`<div class="bar ${i===11?'last':''}" style="height:${Math.round(w[1]/max*100)}%" title="${fmtK(w[0])} ${w[1]}명">${i===11||i===0||w[1]===Math.max(...weeks.map(x=>x[1]))?`<i>${w[1]}</i>`:''}</div>`).join('')}</div>
      <div class="bars-x">${weeks.map((w,i)=>`<span>${i%2===1?'':parseD(w[0]).getMonth()+1+'/'+parseD(w[0]).getDate()}</span>`).join('')}</div>
    </div>
    <div class="panel"><h2>처리할 일</h2><div class="list">
      <div><span>정회원 심사 대상 (운영위 승인 필요)</span><button class="btn sm" data-act="go" data-v="member">${cand.length}명</button></div>
      <div><span>${S().warnWeeks}주 이상 결석</span><button class="btn sm" data-act="go" data-v="abs">${warnA.length}명</button></div>
      <div><span>6개월 이상 결석 (정관 제9조 별명부 대상)</span><button class="btn sm" data-act="go" data-v="abs">${longA.length}명</button></div>
      <div><span>${mo}월 생일</span><button class="btn sm" data-act="go" data-v="bday">${bd.length}명</button></div>
    </div>
    ${warnA.length?`<p class="muted" style="margin:10px 0 0"><b>${S().warnWeeks}주 이상 결석</b> · ${warnA.map(m=>[m,absence(m).days]).sort((x,y)=>y[1]-x[1]).slice(0,15).map(([m,d])=>`${esc(m.name)}(${Math.floor(d/7)}주)`).join(' · ')}${warnA.length>15?` 외 ${warnA.length-15}명`:''}</p>`:''}
    ${bd.length?`<p class="muted" style="margin:8px 0 0"><b>${mo}월 생일</b> · ${bd.slice(0,12).map(m=>`${esc(m.name)}${bDay(m.birth)?' '+bDay(m.birth)+'일':''}${m.lunar?'(음)':''}`).join(' · ')}${bd.length>12?` 외 ${bd.length-12}명`:''}</p>`:''}
    </div>
  </div>`;
};

function renderAttGrid(){
  const a=UI.att,on=attIds();

  if(a.show==='on')list=list.filter(m=>on.has(m.id));if(a.show==='off')list=list.filter(m=>!on.has(m.id));
  const di=d=>{const i=S().districts.indexOf(d);return i<0?99:i};
  list.sort((x,y)=>a.sort==='name'?ko(x.name,y.name):(di(x.district)-di(y.district))||ko(x.name,y.name));
  let html='',cur=null;
  for(const m of list){
    if(a.sort==='district'&&m.district!==cur){cur=m.district;html+=`<div class="dist-h">${esc(cur||'구역 미정')}</div>`}
    const ab=absence(m);const flag=m.status==='별명부'?'별명부':(ab.days>=S().warnWeeks*7&&!on.has(m.id)?`${Math.floor(ab.days/7)}주 결석`:'');

function toggleAtt(id,btn){
  const k=attKey();const rec=DB.attendance[k]||{ids:[],t:0};const set=new Set(rec.ids);
  set.has(id)?set.delete(id):set.add(id);

  updateAttCount();
}

after.off=()=>{$('#offFrom').onchange=e=>{UI.off.from=e.target.value;render()};$('#offTo').onchange=e=>{UI.off.to=e.target.value;render()};$('#offQ').oninput=e=>{UI.off.q=e.target.value;const p=e.target.selectionStart;render();const q=$('#offQ');q.focus();q.setSelectionRange(p,p)}};
function importOff(){
  const ov=modal(`<h3>헌금집계 엑셀 가져오기</h3><p class="muted">주간 헌금집계 파일(이름 · 주정헌금 · 감사헌금 · 십일조 … 형식)을 고르세요. 표 위에 "2026년 9월 20일" 같은 제목이 있으면 그 날짜를, 없으면 아래 날짜를 씁니다. 여러 주가 한 시트에 있어도 됩니다.</p>
  <div class="form"><label>기본 날짜 (주일)<input type="date" id="ioDate" value="${lastDow(0)}"></label><label class="full">파일<input type="file" id="ioFile" accept=".xlsx,.xls,.csv" multiple></label></div>
  <div id="ioPrev"></div><div class="mfoot"><button class="btn" data-act="close">취소</button><button class="btn pri" id="ioOk" disabled>가져오기</button></div>`,true);
  let parsed=[];
  ov.querySelector('#ioFile').onchange=async e=>{
    if(typeof XLSX==='undefined'){toast('엑셀 모듈을 불러오지 못했습니다');return}
    parsed=[];
    for(const file of e.target.files){
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      const fm=file.name.match(/(20\d{2})[.\-_]?(\d{2})[.\-_]?(\d{2})/);
      const fb=fm?`${fm[1]}-${fm[2]}-${fm[3]}`:ov.querySelector('#ioDate').value;
      wb.SheetNames.forEach(n=>{parsed=parsed.concat(parseOfferingGrid(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}),fb))});
    }
    showOffPreview(ov,parsed);
  };
  ov.querySelector('#ioOk').onclick=()=>applyOff(ov,parsed);
}
function showOffPreview(ov,parsed){
  const byName=new Map();activeMembers().concat(members()).forEach(m=>{if(!byName.has(m.name))byName.set(m.name,m)});
  const dates=[...new Set(parsed.map(p=>p.date))].sort();
  const unmatched=[...new Set(parsed.filter(p=>!byName.has(p.name)).map(p=>p.name))];

    ${unmatched.length?`<p>명단에 없는 이름 ${unmatched.length}명 — 체크하면 신규 교인으로 등록합니다 (구역·직분은 나중에 입력)</p><div class="checks">${unmatched.map(n=>`<label><input type="checkbox" class="ioNew" value="${esc(n)}" ${S().demo?'':'checked'}>${esc(n)}</label>`).join('')}</div>`:''}

function applyOff(ov,parsed){

  const grouped={};parsed.forEach(p=>{const m=byName.get(p.name);if(!m)return;(grouped[p.date]=grouped[p.date]||{})[m.id]=p.cats});

}

function rollDates(month,svc){
  const [y,m]=month.split('-').map(Number);const out=[];const d=new Date(y,m-1,1);
  const dow=svc==='sun'?0:svcBy(svc).dow;
  while(d.getMonth()===m-1){if(d.getDay()===dow)out.push(iso(d));d.setDate(d.getDate()+1)}
  return out;
}
function rollMark(id,d,svc){
  if(svc==='sun'){const parts=sunKeys().filter(k=>((DB.attendance[d+'|'+k]||{}).ids||[]).includes(id));return parts.length?parts.map(k=>svcBy(k).name.replace(/[^0-9]/g,'')||'○').join(','):''}
  return ((DB.attendance[d+'|'+svc]||{}).ids||[]).includes(id)?'○':'';
}

function buildReport(kind,arg){
  const s=S(),T=today(),church=s.churchName;
  const di=d=>{const i=s.districts.indexOf(d);return i<0?99:i};
  const byDist=(a,b)=>(di(a.district)-di(b.district))||ko(a.name,b.name);
  if(kind==='roll'){
    const month=(arg&&arg.month)||UI.roll.month,svc=(arg&&arg.svc)||UI.roll.svc;
    const ds=rollDates(month,svc);const list=activeMembers().slice().sort(byDist);
    const rows=list.map((m,i)=>{const marks=ds.map(d=>rollMark(m.id,d,svc));return [i+1,m.name,m.title||'',m.district||'',...marks,marks.filter(Boolean).length]});
    rows.push(['','합계','','',...ds.map(d=>list.filter(m=>rollMark(m.id,d,svc)).length),'']);
    const label=svc==='sun'?'주일예배':svcBy(svc).name;
    return {title:`${church} ${month.replace('-','년 ')}월 ${label} 출석부`,sub:svc==='sun'?'표시: 참석한 부 (1·2·3)':'○ 출석',cols:['번호','이름','직분','구역',...ds.map(d=>fmtK(d)),'출석'],rows,landscape:true,sheet:month+' '+label};
  }
  if(kind==='members'){
    const list=activeMembers().slice().sort(byDist);
    return {title:`${church} 교인명부`,sub:`${fmtY(T)} 기준 · ${list.length}명`,cols:['번호','이름','성별','생년월일','직분','구역','전도회','봉사','연락처','등록일','세례','상태'],
      rows:list.map((m,i)=>[i+1,m.name,m.gender||'',fmtBirth(m.birth)+(m.lunar?'(음)':''),m.title||'',m.district||'',m.society||'',(m.ministries||[]).join(', '),m.phone||'',fmtY(m.regDate),m.baptism||'',m.status]),landscape:true,sheet:'교인명부'};
  }
  if(kind==='assembly'){
    const list=activeMembers().filter(m=>m.status==='정회원'&&(ageOf(m.birth)==null||ageOf(m.birth)>=s.assemblyAge)).sort((a,b)=>ko(a.name,b.name));
    return {title:`${church} 공동의회 회원명부`,sub:`${fmtY(T)} 기준 · ${list.length}명 · 정관 제12조 (만 ${s.assemblyAge}세 이상 정회원)`,cols:['번호','이름','직분','구역','등록일','정회원 승인일','선거권','확인'],
      rows:list.map((m,i)=>[i+1,m.name,m.title||'',m.district||'',fmtY(m.regDate),fmtY(m.approvedDate),voteRight(m)?'○':'',''])  ,sheet:'공동의회명부'};
  }
  if(kind==='candidates'){
    const list=activeMembers().filter(m=>m.status==='준회원').map(m=>[m,eligibility(m)]).filter(x=>x[1].ok).sort((a,b)=>ko(a[0].name,b[0].name));
    return {title:`${church} 정회원 심사 대상자 명단`,sub:`운영위원회 심의용 · ${fmtY(T)}`,cols:['번호','이름','등록일','경과','세례','교육이수','주일출석','근거','결의'],
      rows:list.map(([m,e],i)=>[i+1,m.name,fmtY(m.regDate),e.months+'개월',m.baptism,fmtY(m.eduDate)||'-',`${e.rate.att}/${e.rate.total}주 (${Math.round(e.rate.rate*100)}%)`,e.path==='교육이수'?'제6조 1항':'제6조 2항','']),sheet:'정회원심사'};
  }
  if(kind==='absent'){
    const list=activeMembers().map(m=>[m,absence(m)]).filter(([m,a])=>m.status==='별명부'||m.status==='정지'||a.days>=s.warnWeeks*7).sort((a,b)=>b[1].days-a[1].days);
    return {title:`${church} 장기결석자 명단`,sub:`${fmtY(T)} 기준 · ${s.warnWeeks}주 이상 결석 및 별명부`,cols:['번호','이름','직분','구역','연락처','마지막 출석','결석일수','상태','최근 심방'],
      rows:list.map(([m,a],i)=>{const lv=DB.logs.filter(l=>l.memberId===m.id&&l.type==='심방').sort((x,y)=>y.date.localeCompare(x.date))[0];return [i+1,m.name,m.title||'',m.district||'',m.phone||'',a.last?fmtY(a.last):'없음',a.days,m.status,lv?fmtY(lv.date):'']}),sheet:'결석자'};
  }
  if(kind==='offering'){
    const f=UI.off;const dates=Object.keys(DB.offerings).filter(d=>d>=f.from&&d<=f.to).sort();
    const list=activeMembers().slice().sort(byDist);
    return {title:`${church} 헌금생활 현황`,sub:`${fmtY(f.from)} ~ ${fmtY(f.to)} · 집계 ${dates.length}주 · 금액 미표시`,cols:['번호','이름','구역','참여 주','참여율','십일조 주','참여 항목'],
      rows:list.map((m,i)=>{const o=idx().off.get(m.id)||new Map();const ds=dates.filter(d=>o.has(d));const cats=new Set();let t=0;ds.forEach(d=>o.get(d).forEach(c=>{cats.add(shortCat(c));if(/십일조/.test(c))t++}));return [i+1,m.name,m.district||'',ds.length,dates.length?Math.round(ds.length/dates.length*100)+'%':'',t,[...cats].join(', ')]}),sheet:'헌금생활'};
  }
  if(kind==='birthday'){
    const mo=UI.bday.month;const list=activeMembers().filter(m=>bMonth(m.birth)===mo).sort((a,b)=>(bDay(a.birth)||99)-(bDay(b.birth)||99));
    return {title:`${church} ${mo}월 생일자`,sub:`${list.length}명`,cols:['일','이름','양/음','직분','구역','연락처'],rows:list.map(m=>[bDay(m.birth)||'미상',m.name,m.lunar?'음력':'양력',m.title||'',m.district||'',m.phone||'']),sheet:mo+'월생일'};
  }
}
function toSheet(r){
  const aoa=[[r.title],[r.sub||''],[],r.cols,...r.rows];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:Math.max(0,r.cols.length-1)}}];
  ws['!cols']=r.cols.map((c,i)=>({wch:Math.max(4,Math.min(30,Math.max(String(c).length*2,...r.rows.map(x=>String(x[i]==null?'':x[i]).length*(/[가-힣]/.test(String(x[i]))?2:1)))+1))}));
  return ws;
}
function reportHTML(r){
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(r.title)}</title><style>

  <h1>${esc(r.title)}</h1><p>${esc(r.sub||'')}</p><table><thead><tr>${r.cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
  ${r.rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>

async function exportReport(kind,fmt){
  const stamp=today().replace(/-/g,'');
  if(fmt==='xlsx'&&typeof XLSX==='undefined'){toast('엑셀 모듈을 불러오지 못했습니다');return}
  if(kind==='all'){
    const wb=XLSX.utils.book_new();
    ['members','assembly','absent','offering'].forEach(k=>{const r=buildReport(k);XLSX.utils.book_append_sheet(wb,toSheet(r),r.sheet)});
    const year=today().slice(0,4);for(let m=1;m<=12;m++){const mo=`${year}-${pad(m)}`;if(mo>today().slice(0,7))break;const r=buildReport('roll',{month:mo,svc:'sun'});XLSX.utils.book_append_sheet(wb,toSheet(r),`${m}월 주일`)}
    const lg=[['날짜','이름','구분','내용'],...DB.logs.filter(l=>!l.deleted).sort((a,b)=>a.date.localeCompare(b.date)).map(l=>[l.date,(memberById(l.memberId)||{}).name||'',l.type,l.text])];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(lg),'기록');
    return Host.saveFile(`${S().churchName}_전체자료_${stamp}.xlsx`,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})));
  }
  if(kind==='rollYear'){
    const wb=XLSX.utils.book_new();const year=UI.roll.month.slice(0,4);
    for(let m=1;m<=12;m++){const mo=`${year}-${pad(m)}`;if(mo>today().slice(0,7))break;const r=buildReport('roll',{month:mo,svc:UI.roll.svc});XLSX.utils.book_append_sheet(wb,toSheet(r),`${m}월`)}
    return Host.saveFile(`${S().churchName}_${year}_출석부.xlsx`,new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})));
  }
  const r=buildReport(kind);const base=`${r.title.replace(/\s+/g,'_')}_${stamp}`;
  if(fmt==='xlsx'){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,toSheet(r),r.sheet.slice(0,31));return Host.saveFile(base+'.xlsx',new Uint8Array(XLSX.write(wb,{type:'array',bookType:'xlsx'})))}
  return Host.savePDF(base+'.pdf',reportHTML(r),r.landscape);
}

    ${nf('warnWeeks','결석 관심','주 이상')}${nf('visitMonths','심방 필요','개월 이상')}${nf('longMonths','별명부 대상','개월 이상')}</div></div>

    <h2 style="margin-top:14px">예배 이름</h2><div class="form">${s.services.map((v,i)=>`<label>${DOWK[v.dow]}요일<input type="text" data-svc="${i}" value="${esc(v.name)}"></label>`).join('')}</div></div>
  ${APPINFO?`<div class="panel"><h2>프로그램 업데이트</h2><p class="muted">현재 v${esc(APPINFO.version)}. 새 버전이 GitHub에 올라오면 시작할 때 자동으로 받아 설치합니다. 데이터(${esc(APPINFO.dataDir)})는 그대로 유지됩니다.</p><button class="btn" data-act="checkUpdate">지금 업데이트 확인</button></div>`:''}
  <div class="panel"><h2>백업 · 복원</h2><p class="muted">전체 데이터를 JSON 파일 하나로 저장합니다. 앱을 옮기거나 문제가 생겼을 때 이 파일로 되돌립니다.</p>
    <div class="row"><button class="btn" data-act="backup">백업 파일 저장</button><label class="btn">백업에서 복원<input type="file" id="restore" accept=".json" hidden></label><button class="btn" data-act="exp" data-r="all" data-f="xlsx">전체 Excel</button></div>
    <div class="sec"><div class="row"><button class="btn danger" data-act="loadDemo">예시 데이터 다시 불러오기</button><button class="btn danger" data-act="wipe">모든 데이터 지우기</button></div></div></div>
  </div>`;
};
after.set=()=>{
  const s=S();
  document.querySelectorAll('[data-list]').forEach(el=>el.onchange=()=>{s[el.dataset.list]=el.value.split(',').map(x=>x.trim()).filter(Boolean);touchSettings()});
  document.querySelectorAll('[data-num]').forEach(el=>el.onchange=()=>{s[el.dataset.num]=+el.value||0;touchSettings();toast('기준을 바꿨습니다')});
  document.querySelectorAll('[data-text]').forEach(el=>el.onchange=()=>{s[el.dataset.text]=el.value.trim();touchSettings()});
  document.querySelectorAll('[data-svc]').forEach(el=>el.onchange=()=>{s.services[+el.dataset.svc].name=el.value.trim();touchSettings()});
  $('#gsSave').onclick=()=>{DB.local=DB.local||{};DB.local.sheetUrl=$('#gsUrl').value.trim();DB.local.key=$('#gsKey').value;SYNCERR='';commit();toast('연동 주소를 저장했습니다')};
  $('#restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.members)throw 0;if(!await ask('현재 데이터를 백업 파일 내용으로 바꿉니다.','복원'))return;const local=DB.local;DB=normalize(d);DB.local=local;commit();render();toast('복원했습니다')}catch(x){toast('백업 파일 형식이 아닙니다')}};
};
function normalize(d){
  const db=Object.assign(blankDB(),d||{});db.settings=Object.assign(DEFAULT_SETTINGS(),db.settings||{});
  {const t=db.settings.titles=Array.isArray(db.settings.titles)?db.settings.titles.slice():String(db.settings.titles||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean);[['원로장로','장로'],['은퇴권사','명예권사','권사']].forEach(([n,...after])=>{if(t.includes(n))return;const i=Math.max(...after.map(x=>t.indexOf(x)));t.splice(i<0?t.length:i+1,0,n)});}
  db.members=(db.members||[]).map(m=>Object.assign({ministries:[],deleted:false},m,{birth:normBirth(m.birth),status:(!m.status||m.status==='재적')?'준회원':m.status,ministries:Array.isArray(m.ministries)?m.ministries:String(m.ministries||'').split(',').map(x=>x.trim()).filter(Boolean)}));db.attendance=db.attendance||{};db.offerings=db.offerings||{};db.logs=db.logs||[];db.local=db.local||{};return db;
}
function stripLocal(db){const o=Object.assign({},db);delete o.local;return o}
/* 데스크탑 ↔ 구글시트 자동 동기화: 수정 후 5초, 켤 때, 켜져 있는 동안 3분마다 */
let syncTimer=null,syncBusy=false,syncAgain=false,SYNCERR='';
function dbSig(d){return JSON.stringify([(d.members||[]).map(m=>m.id+':'+(m.updatedAt||0)),Object.keys(d.attendance||{}).map(k=>k+':'+((d.attendance[k]||{}).t||0)),(d.logs||[]).length,Object.keys(d.offerings||{}).length,(d.settings||{}).updatedAt||0])}
function canAutoSync(){const L=DB&&DB.local||{};return Host.kind==='electron'&&!!L.sheetUrl&&!!L.key}
function syncSoon(ms){if(!canAutoSync())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync({quiet:true}),ms==null?5000:ms)}
async function sync(opt){
  const quiet=!!(opt&&opt.quiet);
  const L=DB.local||{};
  if(Host.kind==='gas'){await gasPush(true);return}
  if(!L.sheetUrl){if(!quiet)toast('웹앱 주소를 먼저 저장하세요');return}
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;clearTimeout(syncTimer);renderNav();
  try{
    if(!quiet)toast('동기화 중…');
    const sent=JSON.stringify(stripLocal(DB)),sig0=dbSig(DB);
    const res=JSON.parse(await Host.http(L.sheetUrl,{method:'POST',body:JSON.stringify({action:'push',key:L.key||'',data:JSON.parse(sent)})}));
    if(!res.ok)throw new Error(res.error==='key'?'비밀번호가 다릅니다':res.error);
    const before=members().length;const local=DB.local;DB=normalize(mergeData(DB,res.data));DB.local=local;DB.local.lastSync=now();IDX=null;
    clearTimeout(saveTimer);await Host.save(DB);SYNCERR='';
    const changed=dbSig(DB)!==sig0;
    const a=document.activeElement;const busyUI=document.querySelector('.ov')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName));
    if(!quiet||(changed&&!busyUI))render();else renderNav();
    const added=members().length-before;
    if(!quiet)toast(`구글시트와 동기화했습니다 · 교인 ${members().length}명${added>0?` (새로 ${added}명)`:''}`);
  }catch(e){SYNCERR=(e.message||String(e)).slice(0,60);if(!quiet)toast('동기화 실패: '+(e.message||e))}
  syncBusy=false;renderNav();
  if(syncAgain){syncAgain=false;syncSoon(1000)}
}
/* 구글 웹앱(태블릿)에서 실행될 때 */
let gasTimer=null;
function gasPushSoon(){clearTimeout(gasTimer);gasTimer=setTimeout(()=>gasPush(false),2500)}
function gasPush(loud){return new Promise(res=>{
  const L=DB.local||{};
  google.script.run.withSuccessHandler(txt=>{const r=JSON.parse(txt);if(r.ok){const local=DB.local;DB=normalize(mergeData(DB,r.data));DB.local=local;ls.set(LSKEY,JSON.stringify(DB));IDX=null;if(loud){render();toast('구글시트에 저장했습니다')}}else toast('저장 실패: '+r.error);res()})
   .withFailureHandler(e=>{toast('구글시트 저장 실패: '+e.message);res()}).apiPush(L.key||'',JSON.stringify(stripLocal(DB)));
})}
function askKey(msg,o){o=o||{};return new Promise(r=>{
  const ov=modal(`<h3>${esc(o.title||'연동 비밀번호')}</h3><p class="muted">${esc(o.desc||'관리자에게 받은 비밀번호를 입력하세요. 이 기기에 기억됩니다.')}</p>${msg?`<p style="color:var(--bad,#b3261e)"><b>${esc(msg)}</b></p>`:''}<div class="form"><label class="full">비밀번호<input type="password" id="gk" autocomplete="off"></label></div><div class="mfoot"><button class="btn pri" id="gkOk">확인</button></div>`);
  const inp=ov.querySelector('#gk');setTimeout(()=>inp.focus(),50);
  const done=()=>{const v=inp.value.trim();if(!v){inp.focus();return}ov.remove();r(v)};
  ov.querySelector('#gkOk').onclick=done;inp.onkeydown=e=>{if(e.key==='Enter')done()};
  ov.addEventListener('click',e=>{if(e.target===ov)r(null)});
})}
async function reKey(msg){
  const k=await askKey(msg||'');if(!k)return;DB.local=DB.local||{};const old=DB.local.key;DB.local.key=k;
  try{const remote=await gasPull();const local=DB.local;DB=normalize(mergeData(DB,remote));DB.local=local;ls.set(LSKEY,JSON.stringify(DB));IDX=null;render();toast('구글시트에서 불러왔습니다')}
  catch(e){const m=e.message||String(e);if(/비밀번호/.test(m)){DB.local.key=old;return reKey('비밀번호가 맞지 않습니다. 다시 입력하세요.')}toast('구글시트를 읽지 못했습니다: '+m)}
}
function gasAdmin(pw){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(t=>{const r=JSON.parse(t);r.error?rej(new Error(r.error)):res(!!r.ok)}).withFailureHandler(rej).apiAdmin((DB.local||{}).key||'',pw)})}
/* 전체화면 (주소창 숨김) — 안드로이드·태블릿 브라우저 */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=()=>!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
function enterFS(){const d=document.documentElement;try{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function exitFS(){try{const p=(document.exitFullscreen||document.webkitExitFullscreen).call(document);if(p&&p.catch)p.catch(()=>{})}catch(e){}}
function toggleFS(){fsEl()?exitFS():enterFS()}
function gasFullscreenSetup(){
  if(!fsOK())return;
  ['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>renderNav()));
  if(matchMedia('(pointer:coarse)').matches){const first=()=>{document.removeEventListener('click',first,true);if(!fsEl())enterFS()};document.addEventListener('click',first,true)}
}
/* 웹앱: 다른 기기에서 바뀐 내용 가져오기 — 화면으로 돌아올 때(10초 간격) · 메뉴 누를 때(3분 간격) */
let gasLastPull=0,gasPulling=false;
async function gasRefresh(back){
  const gap=back?10*1000:3*60*1000;
  if(gasPulling||!(DB.local||{}).key||Date.now()-gasLastPull<gap)return;
  gasPulling=true;
  try{const sig0=dbSig(DB);const remote=await gasPull();const local=DB.local;DB=normalize(mergeData(DB,remote));DB.local=local;ls.set(LSKEY,JSON.stringify(DB));IDX=null;gasLastPull=Date.now();
    if(dbSig(DB)!==sig0){const a=document.activeElement;if(!document.querySelector('.ov')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();else renderNav();}}
  catch(e){}
  gasPulling=false;
}
function gasPull(){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(t=>{const r=JSON.parse(t);r.ok?res(r.data):rej(new Error(r.error))}).withFailureHandler(rej).apiPull((DB.local||{}).key||'')})}

async function lanOpen(){
  let info;
  try{info=await churchAPI.lanStart()}catch(e){toast('연결을 시작하지 못했습니다: '+(e.message||e));return}
  if(!info||!info.urls||!info.urls.length){modal(`<h3>태블릿 연결</h3><p>이 PC가 와이파이(공유기)에 연결되어 있지 않습니다. 네트워크를 확인한 뒤 다시 눌러 주세요.</p><div class="mfoot"><button class="btn" data-act="close">닫기</button></div>`);return}
  const qr=u=>{if(typeof qrcode==='undefined')return '';const q=qrcode(0,'M');q.addData(u);q.make();return q.createSvgTag({cellSize:6,margin:2,scalable:true})};
  const main=info.urls[0];
  modal(`<h3>태블릿 연결</h3><p class="muted">태블릿을 이 PC와 <b>같은 와이파이</b>에 연결하고, 카메라로 QR을 찍으면 출석체크 화면이 열립니다. 태블릿에서는 현황 · 출석체크 · 교인관리만 보입니다.</p>
  <div style="display:grid;place-items:center;margin:14px 0"><div style="width:240px;max-width:100%;background:#fff;padding:8px;border-radius:8px">${qr(main)}</div></div>
  <p style="text-align:center;word-break:break-all"><b>${esc(main)}</b></p>
  ${info.urls.length>1?`<p class="muted">연결이 안 되면 다른 주소: ${info.urls.slice(1).map(esc).join(' · ')}</p>`:''}
  <p class="muted">처음 연결할 때 이 PC에 "Windows 보안 경고(방화벽)" 창이 뜨면 <b>개인 네트워크 허용</b>을 눌러 주세요. 이 PC의 프로그램이 켜져 있는 동안 연결됩니다.</p>
  <div class="mfoot"><button class="btn danger" data-act="lanStop" style="margin-right:auto">연결 끄기</button><button class="btn pri" data-act="close">닫기</button></div>`);
}
function lanIncoming(data){
  const before=JSON.stringify(stripLocal(DB)).length;
  const local=DB.local;DB=normalize(mergeData(DB,data));DB.local=local;IDX=null;
  churchAPI.saveData(DB);syncSoon(5000);
  const a=document.activeElement;if(!document.querySelector('.ov')&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();else renderNav();
  return stripLocal(DB);
}

/* ============ 이벤트 ============ */
const ACT={
  go:el=>go(el.dataset.v),
  close:el=>closeModal(el),
  tap:el=>toggleAtt(el.dataset.id,el),
  attSvc:el=>{UI.att.svc=el.dataset.k;const ref=addDays(UI.att.date||today(),6);UI.att.date=lastDow(svcBy(el.dataset.k).dow,ref>today()?today():ref);render()},
  attShift:el=>{UI.att.date=addDays(UI.att.date,+el.dataset.n);render()},
  attShow:el=>{UI.att.show=el.dataset.k;render()},
  attSort:el=>{UI.att.sort=el.dataset.k;render()},
  tablet:()=>{document.body.classList.toggle('tablet');const on=document.body.classList.contains('tablet');if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});render()},
  quickAdd:()=>quickAdd(),
  editMember:el=>{closeModal(el);editMember(el.dataset.id)},
  openMember:(el,e)=>{e.preventDefault();openMember(el.dataset.id)},
  delMember:async el=>{const m=memberById(el.dataset.id);closeModal(el);if(!await ask(`${esc(m.name)} 님을 명단에서 삭제합니다. 출석 기록은 남지만 화면에 보이지 않습니다. 이명·소천은 삭제 대신 상태를 바꾸세요.`,'삭제'))return;m.deleted=true;m.updatedAt=now();commit();render()},
  approve:()=>approve(),
  absTab:el=>{UI.abs.tab=el.dataset.k;render()},
  setStatus:el=>setStatus(el.dataset.id,el.dataset.s),
  visit:el=>visit(el.dataset.id),
  transferOut:()=>transferOut(),
  importOff:()=>importOff(),
  importOffSheet:()=>importOffSheet(),
  bdMonth:el=>{UI.bday.month=+el.dataset.k;render()},
  rollSvc:el=>{UI.roll.svc=el.dataset.k;render()},
  exp:el=>exportReport(el.dataset.r,el.dataset.f),
  sync:()=>sync(),
  lanOpen:()=>lanOpen(),
  toggleAdmin:()=>toggleAdmin(),
  toggleFS:()=>toggleFS(),
  reKey:()=>reKey(),
  lanStop:async el=>{await churchAPI.lanStop();closeModal(el);toast('태블릿 연결을 껐습니다')},
  checkUpdate:()=>{if(window.churchAPI&&churchAPI.checkUpdate)churchAPI.checkUpdate()},
  backup:()=>Host.saveFile(`${S().churchName}_출석부_백업_${today().replace(/-/g,'')}.json`,JSON.stringify(stripLocal(DB),null,1)),
  clearDemo:async()=>{if(!await ask('예시 교인·출석·헌금 기록을 모두 지우고 빈 명단으로 시작합니다.','지우고 시작'))return;const keep=DB.local;const st=DB.settings;DB=blankDB();DB.settings=Object.assign(st,{demo:false,updatedAt:now()});DB.local=keep;commit();go('mem')},
  loadDemo:async()=>{if(!await ask('현재 데이터를 지우고 예시 데이터를 불러옵니다.','불러오기'))return;const keep=DB.local;DB=demoDB();DB.local=keep;commit();render()},
  wipe:async()=>{if(!await ask('모든 교인·출석·기록을 지웁니다. 먼저 백업 파일을 저장해 두세요.','모두 지우기'))return;const keep=DB.local;DB=blankDB();DB.local=keep;commit();render()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f)f(el,e)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const ov=document.querySelector('.ov:last-child');if(ov)ov.remove()}
  if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();
});

/* ============ 시작 ============ */
(async function start(){
  let d=null;
  try{d=await Host.load()}catch(e){}
  if(Host.kind==='electron'&&churchAPI.onLanIncoming)churchAPI.onLanIncoming(lanIncoming);
  if(isTablet())document.body.classList.add('tablet-client');
  if(Host.kind==='lan'){UI.view='att';setInterval(lanPoll,4000)}
  if(Host.kind==='electron'&&churchAPI.appInfo){try{APPINFO=await churchAPI.appInfo();churchAPI.onUpdate(u=>{UPD=u;const f=$('#syncState');if(f)f.innerHTML=syncLabel()+verLabel()})}catch(e){}}
  if(Host.kind==='lan'&&!d)toast('데스크탑에 연결하지 못했습니다. 같은 와이파이인지, 데스크탑 프로그램이 켜져 있는지 확인하세요');
  DB=d?normalize(d):((Host.kind==='gas'||Host.kind==='lan')?blankDB():demoDB());
  if(Host.kind==='gas'){
    gasFullscreenSetup();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')gasRefresh(true)});
    window.addEventListener('pageshow',e=>{if(e.persisted)gasRefresh(true)});
    let msg='';
    for(;;){
      if(!DB.local.key){render();DB.local.key=await askKey(msg);if(!DB.local.key)continue;}
      try{const remote=await gasPull();const local=DB.local;if((remote.members||[]).length)DB=normalize(mergeData(DB,remote));DB.local=local;ls.set(LSKEY,JSON.stringify(DB));IDX=null;gasLastPull=Date.now();break}
      catch(e){const m=e.message||String(e);if(/비밀번호/.test(m)){DB.local.key='';ls.set(LSKEY,JSON.stringify(DB));msg='비밀번호가 맞지 않습니다. 다시 입력하세요.';continue}toast('구글시트를 읽지 못했습니다: '+m);break}
    }
  }
  if(!d&&Host.kind!=='lan')Host.save(DB);
  render();
  if(Host.kind==='electron'){syncSoon(1500);setInterval(()=>{if(!syncBusy)syncSoon(0)},3*60*1000);}
})();
</script>
